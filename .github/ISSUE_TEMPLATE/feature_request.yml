name: Feature request
description: Something nightjar should do that it doesn't yet.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should nightjar do?
      description: The capability, in plain words.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it let you do?
      description: The job it does for you — the situation where you'd reach for it.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else (optional)
      description: Examples from other tools, links, sketches — whatever you've got.
    validations:
      required: false
