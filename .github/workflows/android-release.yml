name: Android APK

on:
  push:
    branches: [main, release/android-v3.0.0]
    paths:
      - 'android/**'
      - 'ios/nightjar/Assets.xcassets/AppBackground.imageset/background.jpg'
      - 'ios/nightjar/Assets.xcassets/AppIcon.appiconset/IMG_1434.png'
      - 'ios/nightjar/centipede.gif'
      - 'nightjar-hack-v3.0.0.apk*'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/nightjar/Assets.xcassets/AppBackground.imageset/background.jpg'
      - 'ios/nightjar/Assets.xcassets/AppIcon.appiconset/IMG_1434.png'
      - 'ios/nightjar/centipede.gif'
      - 'nightjar-hack-v3.0.0.apk*'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android release build and parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release and run shared parity fixtures
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - name: Verify downloadable APK
        run: android/verify-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nightjar-hack-v3.0.0-android
          path: |
            nightjar-hack-v3.0.0.apk
            nightjar-hack-v3.0.0.apk.sha256
            nightjar-hack-v3.0.0.apk.cert.txt
            nightjar-hack-v3.0.0.apk.build.json
          if-no-files-found: error

  publish:
    name: Attach APK to v3.0.0 release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/android-v3.0.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-v3-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nightjar-hack-v3.0.0-android
          path: release-assets
      - name: Publish verified APK without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v3.0.0 --json assets > "$RUNNER_TEMP/assets.json"
          for file in release-assets/*; do
            name="$(basename "$file")"
            if jq -e --arg name "$name" '.assets[] | select(.name == $name)' "$RUNNER_TEMP/assets.json" >/dev/null; then
              mkdir -p "$RUNNER_TEMP/existing"
              gh release download v3.0.0 --pattern "$name" --dir "$RUNNER_TEMP/existing"
              cmp "$file" "$RUNNER_TEMP/existing/$name"
            else
              gh release upload v3.0.0 "$file"
            fi
          done
          gh release view v3.0.0 --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          python3 - "$RUNNER_TEMP/release-notes.md" <<'PY'
          from pathlib import Path
          import sys
          notes = Path(sys.argv[1])
          marker = '<!-- nightjar-android-v3-download -->'
          body = notes.read_text()
          if marker not in body:
              body += '\n\n' + marker + '\n' + Path('android/RELEASE.md').read_text()
              notes.write_text(body)
          PY
          gh release edit v3.0.0 --notes-file "$RUNNER_TEMP/release-notes.md"
