name: Nightjar checks

# One workflow, path-aware: the `changes` gate diffs the PR/push and
# switches each job on only when its side of the tree moved. Jobs that
# are switched off report as skipped, so required checks never hang.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.diff.outputs.python }}
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi
          FILES="$(git diff --name-only $RANGE 2>/dev/null || true)"
          if [ -z "$FILES" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$FILES"
          PY=false
          IOS=false
          grep -Eq '^(tests/|nightjar/|tools/|[^/]+\.py$|\.github/workflows/nightjar-checks\.yml$)' <<<"$FILES" && PY=true
          grep -Eq '^(ios/|tools/test-kernel\.sh$|\.github/workflows/nightjar-checks\.yml$)' <<<"$FILES" && IOS=true
          echo "python=$PY" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS" >> "$GITHUB_OUTPUT"

  kernel:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: Kernel lifecycle XCTest
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the production kernel without app dependencies
        run: tools/test-kernel.sh --sanitize=thread

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run CLI/overlay tests
        run: python -m pytest tests/ -q

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: iOS simulator XCTest
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show native toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Install Metal toolchain for MLX
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Select available iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          SIMULATOR_ID="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              runtimes = json.load(stream)["devices"]
          for runtime in sorted(runtimes, reverse=True):
              if "SimRuntime.iOS-" not in runtime:
                  continue
              for device in runtimes[runtime]:
                  if device.get("isAvailable", True) and "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator installed on the runner")
          PY
          )"
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          echo "Selected iPhone simulator: $SIMULATOR_ID"
      - name: Run iOS unit tests with simulator signing
        run: |
          xcodebuild test \
            -project ios/nightjar.xcodeproj \
            -scheme nightjar \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -resultBundlePath "$RUNNER_TEMP/nightjar-tests.xcresult" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES
      - name: Upload XCTest result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightjar-ios-test-results
          path: ${{ runner.temp }}/nightjar-tests.xcresult
          if-no-files-found: ignore

  mac:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: Native Mac build
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install Metal toolchain for MLX
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build the native Mac target without code signing
        run: |
          xcodebuild build \
            -project ios/nightjar.xcodeproj \
            -scheme nightjar-mac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
