name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check nightjar tests
      - name: Type-check
        run: mypy nightjar
      - name: Test
        run: python -m unittest discover -v
      - name: Smoke-test the CLI without hardware
        shell: bash
        run: |
          nightjar --version
          nightjar demo --out demo.jsonl --days 4 --seed 1
          nightjar scan --simulate --duration 2 --seed 1 --label ci --post ci-runner --log ci.jsonl --quiet
          nightjar report ci.jsonl demo.jsonl --json > /dev/null
          nightjar trackers demo.jsonl
          nightjar anomalies demo.jsonl
