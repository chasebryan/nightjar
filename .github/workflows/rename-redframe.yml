name: Rename redframe GIF (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename UUID GIF to redframe.gif via git mv
        run: |
          git mv "ios/nightjar/gifs/14FF6A7A-67E4-488D-841D-AD2A73119FBD.gif" "ios/nightjar/gifs/redframe.gif"
          git config user.name "nightwarelabz"
          git config user.email "nightwarelabz@users.noreply.github.com"
          git commit -m "Rename 14FF6A7A-67E4-488D-841D-AD2A73119FBD.gif to redframe.gif via git mv"
          git push
