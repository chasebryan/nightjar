<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Freedoom</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: #000; color: #cfcfcf;
        font-family: ui-monospace, Menlo, monospace;
        overflow: hidden; touch-action: none;
        -webkit-user-select: none; user-select: none;
    }
    #stage {
        display: flex; flex-direction: column;
        height: 100%; width: 100%;
    }
    #screen {
        flex: 1 1 auto; min-height: 0;
        display: flex; align-items: center; justify-content: center;
        background: #000;
    }
    canvas {
        background: #000;
        width: min(100vw, 177.78vh);
        max-height: 100%;
        aspect-ratio: 4 / 3;
        image-rendering: pixelated;
    }
    #deck {
        flex: 0 0 auto;
        display: flex; justify-content: space-between; align-items: flex-end;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
        background: #050505;
    }
    #stick { position: relative; width: 100px; height: 100px; flex: 0 0 auto; }
    #buttons { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .row { display: flex; gap: 6px; align-items: center; }
    .btn {
        border: 1px solid #4a1500; background: #1a0d06; color: #e8b48c;
        border-radius: 10px; font: inherit; font-size: 13px;
        padding: 10px 0; width: 54px; text-align: center;
        touch-action: none;
    }
    .btn:active { background: #7d2300; color: #fff; }
    .btn.big {
        width: 80px; padding: 20px 0; font-size: 16px;
        border-color: #7d2300; background: #2a1005;
    }
    .btn.small { width: 44px; padding: 7px 0; font-size: 9px; color: #9a9a9a; border-color: #333; background: #101010; }
    #gate {
        position: fixed; inset: 0; z-index: 10;
        background: #000;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        text-align: center; padding: 24px;
    }
    #gate h1 {
        margin: 0; font-size: 34px; letter-spacing: 6px;
        color: #c33; font-weight: 700;
    }
    #gate p { margin: 0; font-size: 13px; color: #8a8a8a; line-height: 1.7; }
    #play {
        margin-top: 10px;
        font: inherit; font-size: 18px; letter-spacing: 2px;
        color: #fff; background: #7d2300;
        border: 1px solid #c33; border-radius: 12px;
        padding: 16px 44px;
    }
    #play:active { background: #a52e00; }
    #err {
        display: none; color: #f66; font-size: 12px;
        white-space: pre-wrap; word-break: break-word;
        max-width: 92vw;
    }
</style>
</head>
<body>
<div id="stage">
    <div id="screen">
        <canvas id="canvas" width="800" height="600" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
    <div id="deck">
        <div id="stick"></div>
        <div id="buttons">
            <div class="row">
                <div class="btn small" data-key="27">MENU</div>
                <div class="btn small" data-key="9">MAP</div>
                <div class="btn small" data-key="65">&#9664;&#9641;</div>
                <div class="btn small" data-key="68">&#9641;&#9654;</div>
                <div class="btn small" id="weapon">WPN 2</div>
            </div>
            <div class="row">
                <div class="btn" data-key="16">RUN</div>
                <div class="btn" data-key="69">USE</div>
                <div class="btn big" data-key="32">FIRE</div>
            </div>
        </div>
    </div>
</div>

<div id="gate">
    <h1>FREEDOOM</h1>
    <p>Freedoom Phase 1 &middot; version 0.13.0<br/>
    Chocolate Doom, compiled to WebAssembly.<br/>
    Sound is on &mdash; the tap below unlocks it.</p>
    <button id="play">&#9654; PLAY</button>
    <div id="loadstat" style="font-size:13px; color:#aaa; min-height:16px;"></div>
    <div id="err"></div>
    <div id="buildstamp" style="font-size:11px; color:#555;">room build 108</div>
</div>
<script>document.getElementById("buildstamp").textContent = "room build 108 \u00b7 js alive"; try { webkit.messageHandlers.doom.postMessage("breadcrumb"); } catch (e) {}</script>

<script>
    // Engine bootstrap FIRST, alone in its script: nothing
    // that can throw (a controller library, a DOM quirk)
    // is allowed to stand between this page and its Module.
    window.__doomStage = "page";
    function ping(m) {
        try {
            if (window.webkit && webkit.messageHandlers &&
                webkit.messageHandlers.doom) {
                webkit.messageHandlers.doom.postMessage(m);
            }
        } catch (e) {}
    }
    ping("boot script running");
    var doomArgs = ["-iwad", "doom1.wad", "-window", "-nogui",
                    "-nosound",
                    "-config", "default.cfg", "-servername", "nightjar"];
    var started = false;
    var doomReady = false;
    var playWanted = false;

    function showErr(text) {
        var el = document.getElementById("err");
        el.style.display = "block";
        el.textContent = text;
    }

    function stageDetail() {
        var missing = payloadNames.filter(function (n) {
            return !payloads[n];
        });
        return window.__doomStage + (missing.length
            ? " (waiting: " + missing.join(", ") + ")"
            : "");
    }

    // iOS silences WebAudio until a gesture resumes the
    // context; keep a standing listener so SDL's context
    // is revived whenever it suspends.
    function unlockAudio() {
        try {
            if (navigator.audioSession) navigator.audioSession.type = "playback";
        } catch (e) {}
        try {
            if (window.Module && Module.SDL && Module.SDL.audioContext &&
                Module.SDL.audioContext.state === "suspended") {
                Module.SDL.audioContext.resume();
            }
        } catch (e) {}
    }
    document.addEventListener("touchend", unlockAudio, true);
    document.addEventListener("mousedown", unlockAudio, true);

    function sendkey(keys, type) {
        if (!window.Module || !Module.canvas) return;
        keys.forEach(function (key) {
            var ce = new Event(type, { bubbles: true });
            ce.keyCode = key;
            ce.which = key;
            Module.canvas.dispatchEvent(ce);
        });
    }

    function startDoom() {
        if (started) return;
        started = true;
        ping("startDoom — calling main");
        unlockAudio();
        document.getElementById("gate").style.display = "none";
        callMain(doomArgs);
        ping("callMain RETURNED");
    }

    // PLAY is wired NOW, at parse time — never inside a
    // callback the engine may or may not reach. If the
    // engine is still loading, the tap is remembered and
    // the button says so; if loading stalls, the page
    // names the stage it died at instead of sitting mute.
    document.getElementById("play").addEventListener("click", function () {
        ping("PLAY tapped, ready=" + doomReady);
        if (doomReady) { startDoom(); return; }
        playWanted = true;
        document.getElementById("play").textContent = "STARTING…";
        setTimeout(function () {
            if (!doomReady) {
                showErr("Engine not ready (stage: " +
                    stageDetail() + ").");
            }
        }, 8000);
    });
    setTimeout(function () {
        if (!doomReady && !playWanted) {
            showErr("Engine is taking long to start (stage: " +
                stageDetail() + ").");
        }
    }, 15000);

    // The engine's bytes arrive by plain
    // XMLHttpRequest — never fetch(). WebKit's
    // fetch through a custom scheme can stall
    // without ever answering: the runtime is
    // then never born, nothing errors, and the
    // gate sits mute (convicted on device,
    // 2026-10-19; the same page boots in a
    // harness the moment fetch exists). So the
    // page loads all three payloads itself,
    // hands the wasm to the engine directly as
    // wasmBinary, writes the game data into
    // its filesystem in preRun, and only then
    // loads the engine script. No engine-side
    // network remains to stall.
    var Module = null;
    var payloads = {};
    var payloadNames = ["websockets-doom.wasm",
                        "doom1.wad", "default.cfg"];
    var payloadCount = 0;

    function loadNote(text) {
        var el = document.getElementById("loadstat");
        if (el) el.textContent = text;
    }

    function payloadFailed(name, status) {
        ping("FAILED " + name + " (" + status + ")");
        showErr("Could not load " + name +
                " (status " + status + ").");
    }

    function payloadArrived(name, buffer) {
        ping("got " + name);
        payloads[name] = buffer;
        payloadCount += 1;
        loadNote("loaded " + payloadCount +
                 " of " + payloadNames.length + "…");
        if (payloadCount == payloadNames.length) {
            buildModule();
        }
    }

    function fetchPayload(name) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", name, true);
        xhr.responseType = "arraybuffer";
        xhr.onload = function () {
            if (xhr.status == 200 || xhr.status == 0) {
                payloadArrived(name, xhr.response);
            } else {
                payloadFailed(name, xhr.status);
            }
        };
        xhr.onerror = function () {
            payloadFailed(name, xhr.status || "network");
        };
        ping("xhr " + name);
        xhr.send(null);
    }

    function buildModule() {
        ping("all payloads in — building module");
        window.__doomStage = "module";
        Module = {
            noInitialRun: true,
            wasmBinary: payloads["websockets-doom.wasm"],
            preRun: function () {
                Module.FS.writeFile(
                    "doom1.wad",
                    new Uint8Array(payloads["doom1.wad"]));
                Module.FS.writeFile(
                    "default.cfg",
                    new Uint8Array(payloads["default.cfg"]));
            },
            onRuntimeInitialized: function () {
                ping("runtime ready");
                window.__doomStage = "ready";
                doomReady = true;
                loadNote("");
                if (playWanted) startDoom();
            },
            print: function (text) {
                console.log(text);
                ping("out: " + String(text).slice(0, 90));
            },
            printErr: function (text) {
                console.error(text);
                ping("err: " + String(text).slice(0, 90));
                if (String(text).indexOf("doom:") !== 0) {
                    showErr(String(text));
                    if (started) {
                        document.getElementById("gate").style.display = "flex";
                    }
                }
            },
            setStatus: function (text) { console.log(text); },
            canvas: (function () {
                var canvas = document.getElementById("canvas");
                canvas.addEventListener("webglcontextlost", function (e) {
                    e.preventDefault();
                    showErr("Graphics context lost. Close and reopen the room.");
                    document.getElementById("gate").style.display = "flex";
                }, false);
                return canvas;
            })()
        };
        var glue = document.createElement("script");
        glue.src = "websockets-doom.js";
        glue.onload = function () {
            ping("glue loaded");
            window.__doomStage = "glue";
        };
        glue.onerror = function () {
            ping("glue FAILED");
            showErr("The engine script failed to load.");
        };
        document.body.appendChild(glue);
    }

    loadNote("loading engine and game data…");
    ping("loader armed");
    payloadNames.forEach(fetchPayload);

    window.onerror = function (msg) {
        ping("page error: " + msg);
        showErr("Engine error: " + msg);
    };

    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
</script>
<script type="text/javascript" src="nipplejs.min.js"></script>
<script>
    // The controller deck, in its own script: if any of
    // this fails, the failure is reported and the game
    // above stays startable regardless.
    try {
        // Touch buttons: keydown on press, keyup on release.
        Array.from(document.querySelectorAll(".btn")).forEach(function (el) {
            if (!el.dataset.key) return;
            var key = parseInt(el.dataset.key, 10);
            var down = function (e) { e.preventDefault(); sendkey([key], "keydown"); };
            var up = function (e) { e.preventDefault(); sendkey([key], "keyup"); };
            el.addEventListener("touchstart", down, { passive: false });
            el.addEventListener("touchend", up, { passive: false });
            el.addEventListener("touchcancel", up, { passive: false });
            el.addEventListener("mousedown", down);
            el.addEventListener("mouseup", up);
        });

        // Weapon key: tap cycles the number keys
        // 1-7 (fist/chainsaw share slot 1) and
        // shows the slot it just asked for.
        var weaponSlot = 2;
        var weaponEl = document.getElementById("weapon");
        var weaponTap = function (e) {
            e.preventDefault();
            weaponSlot = weaponSlot % 7 + 1;
            var code = 48 + weaponSlot; // '1'..'7'
            sendkey([code], "keydown");
            setTimeout(function () { sendkey([code], "keyup"); }, 60);
            weaponEl.textContent = "WPN " + weaponSlot;
        };
        weaponEl.addEventListener("touchstart", weaponTap, { passive: false });
        weaponEl.addEventListener("mousedown", weaponTap);

        // Left stick: arrows to move/turn, far push adds run.
        var stick = nipplejs.create({
            zone: document.getElementById("stick"),
            color: "#7d2300", mode: "static",
            position: { left: "50%", top: "50%" }
        });
        var K = { left: 37, right: 39, down: 40, up: 38, speed: 16 };
        stick.on("end", function () {
            sendkey([K.left, K.right, K.down, K.up, K.speed], "keyup");
        });
        stick.on("move", function (evt, data) {
            if (!data.direction) return;
            if (data.distance <= 14) {
                sendkey([K.left, K.right, K.down, K.up, K.speed], "keyup");
                return;
            }
            var angle = data.angle.degree;
            var press = { left: false, right: false, down: false, up: false };
            switch (data.direction.angle) {
                case "left":
                    press.left = true;
                    if (angle >= 120 && angle <= 150) press.up = true;
                    if (angle >= 210 && angle <= 240) press.down = true;
                    break;
                case "right":
                    press.right = true;
                    if (angle >= 30 && angle <= 60) press.up = true;
                    if (angle >= 300 && angle <= 330) press.down = true;
                    break;
                case "up":
                    press.up = true;
                    if (angle >= 120 && angle <= 150) press.left = true;
                    if (angle >= 30 && angle <= 60) press.right = true;
                    break;
                case "down":
                    press.down = true;
                    if (angle >= 210 && angle <= 240) press.left = true;
                    if (angle >= 300 && angle <= 330) press.right = true;
                    break;
            }
            sendkey([K.left], press.left ? "keydown" : "keyup");
            sendkey([K.right], press.right ? "keydown" : "keyup");
            sendkey([K.down], press.down ? "keydown" : "keyup");
            sendkey([K.up], press.up ? "keydown" : "keyup");
            sendkey([K.speed], data.distance > 44 ? "keydown" : "keyup");
        });
    } catch (e) {
        showErr("Controller failed: " + e.message);
    }
</script>
</body>
</html>
