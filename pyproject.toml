[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightjar"
version = "1.1.0"
description = "A passive Bluetooth Low Energy listening post: collect advertisements, build a device registry, learn the pattern of life."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22",
]

[project.scripts]
nightjar = "nightjar.cli:main"

[tool.setuptools.packages.find]
include = ["nightjar*"]
